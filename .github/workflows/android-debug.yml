name: Android Debug Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0-debug"
        required: true
        type: string

permissions:
  contents: write

env:
  SUPABASE_URL: https://redanon.xerus-hamal.ts.net

jobs:
  release:
    name: Build and publish Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check Supabase anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing GitHub secret: SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Verify Supabase guest product access
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if curl --silent --show-error --fail \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/products?select=slug&limit=1"; then
            exit 0
          fi

          status=$?
          if [ "$status" -eq 6 ]; then
            echo "::warning::Skipping live Supabase smoke test because the tailnet-only host is not resolvable from this runner."
            exit 0
          fi

          exit "$status"

      - name: Build debug APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk release/kenko-shop-debug.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Kenko Shop ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            Debug APK built with:
            - SUPABASE_URL=${{ env.SUPABASE_URL }}
          files: release/kenko-shop-debug.apk
